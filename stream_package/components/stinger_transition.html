<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>MentysTV // Stinger Transition (Přechod Scén)</title>
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <link rel="stylesheet" href="../css/stream_theme.css">
  <style>
    body {
      background: transparent !important;
      overflow: hidden;
    }

    .stinger-wrapper {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Angled Energy Blades */
    .stinger-blade {
      position: absolute;
      top: -20%;
      height: 140%;
      width: 120%;
      transform: skewX(-25deg) translateX(-180%);
      transition: none;
    }

    .blade-back {
      background: linear-gradient(90deg, #120d29, #2b0c59, #4c1d95);
      z-index: 1;
    }

    .blade-mid {
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-violet));
      box-shadow: 0 0 50px var(--neon-violet);
      z-index: 2;
    }

    .blade-front {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
      box-shadow: 0 0 60px var(--neon-cyan);
      z-index: 3;
      width: 25px;
    }

    /* Stinger Center Logo Emblem */
    .stinger-emblem {
      position: absolute;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: scale(0.6);
    }

    .stinger-logo {
      font-family: var(--font-display);
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #fff 30%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 30px var(--neon-cyan));
    }

    /* Active Animation Classes */
    .animating .blade-back {
      animation: swipeBlade 1.1s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }
    .animating .blade-mid {
      animation: swipeBlade 1.1s cubic-bezier(0.77, 0, 0.175, 1) 0.05s forwards;
    }
    .animating .blade-front {
      animation: swipeBlade 1.1s cubic-bezier(0.77, 0, 0.175, 1) 0.08s forwards;
    }

    .animating .stinger-emblem {
      animation: emblemPop 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes swipeBlade {
      0% { transform: skewX(-25deg) translateX(-180%); }
      48%, 52% { transform: skewX(-25deg) translateX(0%); }
      100% { transform: skewX(-25deg) translateX(180%); }
    }

    @keyframes emblemPop {
      0% { opacity: 0; transform: scale(0.4) rotate(-5deg); }
      45%, 55% { opacity: 1; transform: scale(1.1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.5) rotate(5deg); }
    }

    /* Play Trigger button for testing */
    .trigger-btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--neon-violet);
      color: #fff;
      border: 1px solid var(--neon-cyan);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 3px;
      padding: 14px 36px;
      cursor: pointer;
      box-shadow: 0 0 25px var(--neon-violet);
      z-index: 100000;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }

    .trigger-btn:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 35px var(--neon-cyan);
    }
  </style>
</head>
<body class="transparent-scene">

  <div class="stinger-wrapper" id="stinger">
    <div class="stinger-blade blade-back"></div>
    <div class="stinger-blade blade-mid"></div>
    <div class="stinger-blade blade-front"></div>

    <div class="stinger-emblem">
      <div class="stinger-logo">MENTYS TV</div>
      <div class="cyber-badge" style="background: rgba(0,0,0,0.8);">
        <span class="pulse-dot"></span>
        <span>SCENE TRANSITION // 60 FPS</span>
      </div>
    </div>
  </div>

  <button class="trigger-btn" id="play-btn" onclick="playStinger()">⚡ PUSTIT STINGER PŘECHOD (TEST)</button>

  <script src="../js/stream_core.js"></script>
  <script>
    function playStinger() {
      const stinger = document.getElementById('stinger');
      stinger.classList.remove('animating');
      void stinger.offsetWidth; // Trigger reflow
      stinger.classList.add('animating');
      CyberSound.playStingerSound();
    }

    // Auto-hide button if in OBS
    if (new URLSearchParams(window.location.search).has('obs')) {
      document.getElementById('play-btn').style.display = 'none';
      playStinger();
    }
  </script>
</body>
</html>
