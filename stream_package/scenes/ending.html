<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>MentysTV // Konec Streamu (Ending Scene)</title>
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <link rel="stylesheet" href="../css/stream_theme.css">
  <style>
    .ending-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .ending-card {
      width: 860px;
      padding: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }

    .emotes-row {
      display: flex;
      gap: 24px;
      margin-bottom: 8px;
    }

    .emote-badge-card {
      width: 90px;
      height: 90px;
      background: rgba(18, 14, 38, 0.8);
      border: 1px solid var(--neon-violet);
      padding: 10px;
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 0 16px var(--hud-glow);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emote-badge-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="stream-scene">
  <canvas id="bg-canvas"></canvas>
  <div class="cyber-vignette"></div>
  <div class="scanlines"></div>

  <div class="ending-container">
    <div class="emotes-row">
      <div class="emote-badge-card" style="border-color: var(--neon-cyan);">
        <img src="../assets/emotes/mentys_gg_112.png" alt="GG">
      </div>
      <div class="emote-badge-card" style="border-color: var(--neon-pink);">
        <img src="../assets/emotes/mentys_hype_112.png" alt="Hype">
      </div>
      <div class="emote-badge-card" style="border-color: var(--neon-violet);">
        <img src="../assets/emotes/mentys_lurk_112.png" alt="Lurk">
      </div>
    </div>

    <div class="cyber-panel ending-card">
      <div class="cyber-badge">
        <span class="pulse-dot"></span>
        <span>BROADCAST TERMINATED // MISSION COMPLETE</span>
      </div>

      <h1 class="cyber-title" style="font-size: 64px; letter-spacing: 6px;">DÍKY ZA SLEDOVÁNÍ!</h1>
      
      <p style="font-size: 22px; color: var(--neon-cyan); font-weight: 600; letter-spacing: 3px; text-transform: uppercase;">
        Dnešní mise splněna // Uvidíme se zase příště!
      </p>

      <div style="font-size: 16px; color: #cbd5e1; line-height: 1.5; max-width: 650px;">
        Nezapomeň dát <strong>Follow / Odběr</strong>, ať nezmeškáš další stream, a stav se pokecat s námi na Discord serveru!
      </div>

      <div class="social-pills" style="margin-top: 10px;">
        <div class="social-pill">
          <span>Twitch: MentysTV</span>
        </div>
        <div class="social-pill">
          <span>YouTube: MentysTV</span>
        </div>
        <div class="social-pill">
          <span>Discord: discord.gg/mentys</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/stream_core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      new CyberBackground('bg-canvas');
    });
  </script>
</body>
</html>
