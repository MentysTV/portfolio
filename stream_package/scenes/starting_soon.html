<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>MentysTV // Stream Začíná (Starting Soon)</title>
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <link rel="stylesheet" href="../css/stream_theme.css">
  <style>
    .starting-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .brand-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .main-logo-text {
      font-size: 84px;
      letter-spacing: 8px;
    }

    .sub-status-text {
      font-family: var(--font-hud);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      text-shadow: 0 0 12px var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .starting-card {
      width: 820px;
      padding: 36px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .tips-marquee {
      font-family: var(--font-hud);
      font-size: 16px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid rgba(157, 78, 221, 0.3);
      padding-top: 16px;
      width: 100%;
      text-align: center;
    }

    .tips-marquee span {
      color: #fff;
    }
  </style>
</head>
<body class="stream-scene">
  <canvas id="bg-canvas"></canvas>
  <div class="cyber-vignette"></div>
  <div class="scanlines"></div>

  <div class="starting-container">
    <!-- Brand / Status -->
    <div class="brand-box">
      <div class="cyber-badge">
        <span class="pulse-dot"></span>
        <span>BROADCAST SIGNAL // CONNECTING TO SERVER</span>
      </div>
      <h1 class="cyber-title main-logo-text ambient-glow">MENTYS TV</h1>
      <div class="sub-status-text">
        <span>⚡ STREAM ZAČÍNÁ ZA OKAMŽIK ⚡</span>
      </div>
    </div>

    <!-- Center Card with Countdown -->
    <div class="cyber-panel starting-card">
      <div class="countdown-label">// ODPOČET DO ZAHÁJENÍ VYSIELÁNÍ //</div>
      
      <div class="countdown-box">
        <div class="countdown-time" id="countdown-display">05:00</div>
      </div>

      <!-- Socials -->
      <div class="social-pills">
        <div class="social-pill">
          <svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
          <span>Twitch: MentysTV</span>
        </div>
        <div class="social-pill">
          <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          <span>YouTube: MentysTV</span>
        </div>
        <div class="social-pill">
          <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
          <span>Discord: /mentys</span>
        </div>
      </div>

      <div class="tips-marquee">
        Připrav si pití, napiš do chatu <span>!discord</span> a užij si dnešní stream!
      </div>
    </div>
  </div>

  <script src="../js/stream_core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      new CyberBackground('bg-canvas');
      new StreamCountdown('countdown-display', 300, () => {
        document.getElementById('countdown-display').textContent = "ONLINE";
        document.getElementById('countdown-display').style.color = "var(--neon-cyan)";
      });
    });
  </script>
</body>
</html>
