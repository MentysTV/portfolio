<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>MentysTV // Hned Jsem Zpět (BRB Pause)</title>
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <link rel="stylesheet" href="../css/stream_theme.css">
  <style>
    .brb-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .brb-card {
      width: 760px;
      padding: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .brb-pulse-ring {
      width: 120px;
      height: 120px;
      border: 3px solid var(--neon-cyan);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 25px var(--neon-cyan), inset 0 0 20px var(--neon-violet);
      animation: spinRing 8s linear infinite;
    }

    .brb-pulse-ring::before {
      content: '';
      position: absolute;
      inset: -10px;
      border: 2px dashed var(--neon-violet);
      border-radius: 50%;
      animation: spinRingReverse 12s linear infinite;
    }

    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinRingReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .brb-core-icon {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 15px var(--neon-cyan);
    }
  </style>
</head>
<body class="stream-scene">
  <canvas id="bg-canvas"></canvas>
  <div class="cyber-vignette"></div>
  <div class="scanlines"></div>

  <div class="brb-container">
    <div class="brb-pulse-ring">
      <div class="brb-core-icon">⏸</div>
    </div>

    <div class="cyber-panel brb-card">
      <div class="cyber-badge">
        <span class="pulse-dot"></span>
        <span>STANDBY MODE // STREAM PAUSED</span>
      </div>

      <h1 class="cyber-title" style="font-size: 68px; letter-spacing: 6px;">HNED JSEM ZPĚT</h1>
      
      <p style="font-size: 20px; color: var(--neon-cyan); font-weight: 600; letter-spacing: 3px; text-transform: uppercase;">
        Doplňuji palivo // Odběhl jsem si na minutku
      </p>

      <div class="social-pills" style="margin-top: 14px;">
        <div class="social-pill">
          <span>Twitch: MentysTV</span>
        </div>
        <div class="social-pill">
          <span>YouTube: MentysTV</span>
        </div>
        <div class="social-pill">
          <span>Discord: discord.gg/mentys</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/stream_core.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      new CyberBackground('bg-canvas');
    });
  </script>
</body>
</html>
